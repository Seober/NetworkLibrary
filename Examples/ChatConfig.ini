# ChatServer / ChatDummyClient 설정 — 두 프로그램이 이 파일 하나를 공유해서 읽는다.
#
# 주석은 # 또는 ; (줄 전체 또는 값 뒤). 값 앞뒤 공백은 무시됨.
# 값 자체에는 # 와 ; 를 쓸 수 없음 (주석으로 잘림).
# 실행 파일 옆의 복사본을 읽는다. 명령 인수로 다른 경로를 넘길 수도 있다.

[Server]
ListenIP        = 0.0.0.0   ; 0.0.0.0 = 모든 인터페이스(INADDR_ANY). 특정 IP 지정 가능
Port            = 12001
MaxUser         = 16000     ; 최대 유저 수. 세션 풀은 이 값의 2배. 상한 32767
WorkerThreadCnt = 0         ; IOCP 워커 스레드 수. 0=자동(코어수-1)
NagleEnabled    = false     ; true=패킷 뭉침(대역폭 유리, 지연 증가)
                            ; false=즉시 전송(지연 최소, 패킷 수 증가)

[Client]
; 시간 단위: ms
ServerIP         = 127.0.0.1
ServerPort       = 12001    ; Server.Port 와 같아야 함
ClientCount      = 2000     ; 동시 접속 세션 수
MessageInterval  = 100      ; 세션당 송신 간격
LifetimeMin      = 0        ; 무작위 끊김 최소 유지 시간. 0=끊지 않음
LifetimeMax      = 0        ; 무작위 끊김 최대 유지 시간. Min>0 일 때만 의미
SessionPerThread = 256      ; 스레드당 목표 세션 수 (스레드 수 = ceil(N/이 값), 코어 수로 상한)
