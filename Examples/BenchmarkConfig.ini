# NetworkLibrary 성능 측정 설정 — 자세한 설명은 docs/Benchmark.md
#
# 주석은 # 또는 ; (줄 전체 또는 값 뒤). 값 앞뒤 공백은 무시됨.
# 값 자체에는 # 와 ; 를 쓸 수 없음 (주석으로 잘림).
# TestServer 와 TestClient 가 이 파일 하나를 공유해서 읽는다.
#
# 두 프로그램 모두 timeBeginPeriod(1) 로 타이머 해상도를 1ms 로 올린 뒤 측정한다.
# OS 기본값(약 15.6ms)에서는 송신 간격이 그 배수로 양자화되어 부하가 설정대로 걸리지 않는다.
# [주의] Windows 11 은 창이 최소화되거나 완전히 가려지면 이 해상도 보장을 해제한다.
#        측정 중에는 콘솔 창을 내리지 말 것.

[Run]
Label     = baseline    ; 런 이름. CSV 파일명과 요약 행에 기록
OutputDir = Benchmark   ; 결과 CSV 폴더 (실행 파일 기준 상대경로)

[Analysis]
; 시간 단위: 분
; 측정 시간 = Minutes,  클라이언트 실행 시간 = Minutes + Trim * 2
; 트래픽 시작 직후 Trim분, 종료 직전 Trim분은 통계에서 제외
;   (접속 ramp / 메모리풀 성장 / 종료 구간을 평균에서 배제)
; 샘플 주기는 1초 고정 — TPS 수치의 비교 가능성 유지
Minutes = 30   ; 5=smoke(비교 대상 아님) / 30=기본 / 60=확장 / 0=무제한(Q로 종료)
Trim    = 5    ; smoke 티어는 1 권장

[Server]
; 시간 단위: 분
Port            = 12001
MaxUser         = 32000   ; 세션 풀 크기 (ClientCount 이상이어야 함)
WorkerThreadCnt = 0       ; IOCP 워커 스레드 수. 0=자동(코어수-1)
NagleEnabled    = false   ; true=패킷 뭉침(대역폭 유리, 지연 증가)
                          ; false=즉시 전송(지연 최소, 패킷 수 증가)
IdleTimeout     = 5       ; 트래픽 없는 상태가 이만큼 지속되면 런 종료
                          ;   (Mode 2 사용 시 ReconnectMax 보다 커야 함)

[Client]
; 시간 단위: ms
ServerIP        = 127.0.0.1
ServerPort      = 12001   ; Server.Port 와 같아야 함
ClientCount     = 2000    ; 동시 접속 세션 수
WorkerThreadCnt = 0       ; IOCP 워커 스레드 수. 0=자동(코어수-1)
SendIntervalMin = 1       ; 세션당 송신 간격 최소. 매 송신마다 Min~Max 무작위
SendIntervalMax = 5       ; 송신 간격 최대. 값이 작을수록 부하 증가
Mode            = 1       ; 1=접속 유지 / 2=끊고 재접속 반복
LifetimeMin     = 0       ; [Mode 2] 접속 유지 시간 최소
LifetimeMax     = 0       ; [Mode 2] 접속 유지 시간 최대
ReconnectMin    = 0       ; [Mode 2] 끊은 뒤 재접속 대기 최소
ReconnectMax    = 0       ; [Mode 2] 재접속 대기 최대
